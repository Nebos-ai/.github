# Fixtures for the shared scripts: close-on-merge (NPTE-181) and keep-prs-current (PHTW-212).
# Standard library and git only, no secrets.
name: close-on-merge fixtures

on:
  pull_request:
    paths:
      - scripts/close_on_merge.py
      - scripts/sync_automations_manifest.py
      - scripts/keep_prs_current.py
      - tests/**
      - .github/workflows/close-on-merge*.yml
      - .github/workflows/keep-prs-current.yml
  push:
    branches: [main]
    paths:
      - scripts/close_on_merge.py
      - scripts/sync_automations_manifest.py
      - scripts/keep_prs_current.py
      - tests/**
      - .github/workflows/close-on-merge*.yml
      - .github/workflows/keep-prs-current.yml

permissions:
  contents: read

jobs:
  fixtures:
    name: close-on-merge fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run the fixtures
        run: python3 -m unittest discover -s tests -v
