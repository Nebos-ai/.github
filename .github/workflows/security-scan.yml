# Nebos-ai reusable workflow — security-scan v1 (SOSS-8, 2026-10-27)
#
# Downstream consumers reference this via:
#   uses: Nebos-ai/.github/.github/workflows/security-scan.yml@main
#
# What it does on every PR / push:
#   1. gitleaks   — scans the full git history for committed secrets.
#   2. dep audit  — one audit per entry in `targets`, using the lockfile's own tool:
#                     uv           -> `uv export --frozen` then pip-audit
#                     requirements -> pip-audit -r <file>
#                     pnpm         -> pnpm audit (lockfile only, no install)
#                     npm          -> npm audit --package-lock-only
#   3. static     — bandit (Python) over `bandit_paths`, only when that input is set.
#
# POSTURE: WARN-FIRST (ADR-115) BY DEFAULT. Every scan step is `continue-on-error: true`, so
# findings surface as ::warning:: annotations plus a job summary and NEVER fail the
# job or block a merge. Graduating a scan to blocking is a deliberate per-repo change:
# the caller passes block_secrets / block_audit / block_static = true, and only for a scan
# that is clean on the repo's main. Every input defaults to false, so a repo that passes
# none of them behaves exactly as before.
#   block_secrets: on a pull request the gitleaks scan covers only the commits the PR adds
#                  (base..head) and the job fails on any finding or if the scan cannot run.
#                  Pushes keep the warn-first full-history scan.
#   block_audit:   the dependency audit step fails on any finding or if the audit cannot run.
#   block_static:  the static-analysis job (bandit) fails on any finding at or above the
#                  chosen severity.
#
# Output is counts plus file / rule / package names only. Secret values are never
# printed (gitleaks runs with --redact). Each job prints one greppable line:
#   SOSS8_FINDINGS gitleaks=<n>
#   SOSS8_FINDINGS audit kind=<kind> dir=<dir> vulns=<n>
#   SOSS8_FINDINGS bandit=<n>
# In a private repository the gitleaks job also prints one names-only line per finding,
# read by nebos-backend's key rotation report (SOSS-25). Rule id, start line, commit date
# and file only; never the Secret or Match fields. A public repository's job logs are
# public, so there it prints the count line only.
#   SOSS8_GITLEAKS rule=<rule id> line=<n> date=<commit date> file=<path>
#
# `targets` is a JSON array, e.g.
#   [{"kind":"uv","dir":"."},{"kind":"npm","dir":"frontend"},
#    {"kind":"requirements","dir":"backend","file":"requirements.txt"}]
# Leave it `[]` for repos with nothing to audit (gitleaks still runs).

name: security-scan

on:
  workflow_call:
    inputs:
      targets:
        description: JSON array of dependency-audit targets (kind, dir, optional file).
        type: string
        default: "[]"
      gitleaks_version:
        description: >-
          gitleaks version (without the leading v). Only the default is available: the image is
          pinned by digest for 8.28.0, and any other value fails the install step early.
        type: string
        default: "8.28.0"
      block_secrets:
        description: Fail the job on gitleaks findings (PR runs scan only the PR's new commits).
        type: boolean
        default: false
      block_audit:
        description: Fail the dependency-audit job on known vulnerabilities.
        type: boolean
        default: false
      block_static:
        description: Fail the static-analysis job on bandit findings.
        type: boolean
        default: false
      bandit_paths:
        description: Space-separated paths for bandit (app code only). Empty skips static analysis.
        type: string
        default: ""
      bandit_exclude:
        description: Comma-separated paths bandit excludes (tests, fixtures).
        type: string
        default: "./tests,./.venv,./node_modules"
      bandit_severity:
        description: Minimum bandit severity that counts (low, medium or high).
        type: string
        default: "medium"
      bandit_version:
        description: bandit version, pinned.
        type: string
        default: "1.8.6"

permissions:
  contents: read

jobs:
  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # 2026-11-08 GitHub release outage: github.com/.../releases/download answered 504 from about
      # 09:12Z, so the old curl install failed this scan on every PR in every repo. CI tools now come
      # from a container image pinned by digest (the same pattern as actionlint in nebos-frontend),
      # not from a release download. The digest below is the OCI index of
      # ghcr.io/gitleaks/gitleaks:v8.28.0 (read from the registry, HEAD on the manifest, header
      # Docker-Content-Digest). It serves the default gitleaks_version only.
      - name: Install gitleaks (pinned image)
        env:
          VER: ${{ inputs.gitleaks_version }}
          PINNED_VER: "8.28.0"
          IMAGE: ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
        run: |
          set -euo pipefail
          if [ "$VER" != "$PINNED_VER" ]; then
            echo "::error title=gitleaks::gitleaks_version=${VER} is not available: only ${PINNED_VER} is pinned by image digest. Drop the input or update the digest in Nebos-ai/.github security-scan.yml."
            exit 1
          fi
          docker pull "$IMAGE"
          mkdir -p "$RUNNER_TEMP/bin"
          # The wrapper keeps the scan step unchanged: the repo is mounted at /repo (cwd) and
          # RUNNER_TEMP at the same path, so --report-path "$RUNNER_TEMP/gitleaks.json" lands on the host.
          # The image entrypoint is gitleaks. safe.directory avoids git dubious-ownership on the mount.
          {
            echo '#!/usr/bin/env bash'
            echo 'exec docker run --rm -v "$PWD:/repo" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w /repo \'
            echo '  -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="*" \'
            echo "  \"$IMAGE\" \"\$@\""
          } > "$RUNNER_TEMP/bin/gitleaks"
          chmod +x "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version
      - name: Scan history (warn-first unless block_secrets)
        id: scan
        continue-on-error: ${{ !inputs.block_secrets }}
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
          BLOCKING: ${{ inputs.block_secrets }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # No -e / pipefail: the scan decides its own exit code (fails only when blocking).
          set +e
          set -u
          # Blocking applies to pull requests only; a push to main keeps the warn-first full scan.
          if [ -z "${BASE_SHA:-}" ]; then BLOCKING=false; fi
          # Blocking mode on a pull request scans only the commits the PR adds, so old history
          # findings never turn a new PR red. Everything else scans the full history.
          extra=()
          if [ "$BLOCKING" = "true" ]; then
            extra=(--log-opts "${BASE_SHA}..${HEAD_SHA}")
          fi
          gitleaks detect --source . --redact --no-banner "${extra[@]}" \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" --exit-code 0
          rc=$?
          if [ $rc -ne 0 ] || [ ! -s "$RUNNER_TEMP/gitleaks.json" ]; then
            echo "SOSS8_FINDINGS gitleaks=unknown"
            echo "::warning title=gitleaks::scan could not run (rc=$rc)"
            if [ "$BLOCKING" = "true" ]; then exit 1; fi
            exit 0
          fi
          n=$(jq 'length' "$RUNNER_TEMP/gitleaks.json")
          echo "SOSS8_FINDINGS gitleaks=${n}"
          # Names only, one line per finding, for the key rotation report (SOSS-25): rule id,
          # start line, commit date and file. Never the Secret or Match fields. Private
          # repositories only, because a public repository's job logs are public.
          if [ "$n" -gt 0 ] && [ "${REPO_PRIVATE:-}" = "true" ]; then
            jq -r '.[] | "SOSS8_GITLEAKS rule=\(.RuleID) line=\(.StartLine) date=\(.Date) file=\(.File)"' "$RUNNER_TEMP/gitleaks.json" | head -n 500
          fi
          {
            echo "### gitleaks: ${n} finding(s)"
            if [ "$n" -gt 0 ]; then
              echo "| Rule | File | Line |"
              echo "|---|---|---|"
              jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) |"' "$RUNNER_TEMP/gitleaks.json" | sort -u | head -50
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ]; then
            if [ "$BLOCKING" = "true" ]; then
              echo "::error title=gitleaks::${n} possible committed secret(s) in this PR; see job summary (rule and file only). Blocking."
              exit 1
            fi
            echo "::warning title=gitleaks::${n} possible committed secret(s); see job summary (rule and file only). Warn-first, not blocking."
          fi

  dependency-audit:
    name: dependency audit (${{ matrix.kind }} ${{ matrix.dir }})
    if: ${{ inputs.targets != '[]' && inputs.targets != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        if: ${{ matrix.kind == 'uv' || matrix.kind == 'requirements' }}
      - uses: actions/setup-node@v7
        if: ${{ matrix.kind == 'pnpm' || matrix.kind == 'npm' }}
        with:
          node-version: "22"
      - name: Audit (warn-first unless block_audit)
        continue-on-error: ${{ !inputs.block_audit }}
        working-directory: ${{ matrix.dir }}
        env:
          BLOCKING: ${{ inputs.block_audit }}
          KIND: ${{ matrix.kind }}
          DIR: ${{ matrix.dir }}
          REQ_FILE: ${{ matrix.file || 'requirements.txt' }}
        run: |
          # Audit tools exit non-zero when they find vulnerabilities. The step fails only when blocking.
          set +e
          set -u
          out="$RUNNER_TEMP/audit.json"
          n=unknown
          case "$KIND" in
            uv)
              uv export --frozen --no-hashes --no-emit-project -o "$RUNNER_TEMP/req.txt" >/dev/null
              uvx pip-audit -r "$RUNNER_TEMP/req.txt" --no-deps --disable-pip --format json > "$out"
              ;;
            requirements)
              # No lockfile: audit only exact pins (name==version). Ranges and private
              # packages cannot be resolved without credentials, so they are not covered.
              grep -E '^[A-Za-z0-9_.-]+(\[[A-Za-z0-9_,.-]+\])?==' "$REQ_FILE" > "$RUNNER_TEMP/pinned.txt"
              uvx pip-audit -r "$RUNNER_TEMP/pinned.txt" --no-deps --disable-pip --format json > "$out"
              ;;
            pnpm)
              npx --yes pnpm@10 audit --json > "$out"
              ;;
            npm)
              npm audit --package-lock-only --json > "$out"
              ;;
            *) echo "unknown kind $KIND"; exit 0 ;;
          esac
          # The report, not the exit code, is what counts.
          if [ ! -s "$out" ] || ! jq -e . "$out" >/dev/null 2>&1; then
            echo "SOSS8_FINDINGS audit kind=${KIND} dir=${DIR} vulns=unknown"
            echo "::warning title=dependency audit (${KIND} ${DIR})::audit could not run or produced no report"
            if [ "$BLOCKING" = "true" ]; then exit 1; fi
            exit 0
          fi
          case "$KIND" in
            uv|requirements)
              n=$(jq '[.dependencies[].vulns | length] | add // 0' "$out")
              names=$(jq -r '[.dependencies[] | select((.vulns|length)>0) | "\(.name)==\(.version) (\(.vulns|length))"] | .[]' "$out" | head -50)
              ;;
            pnpm|npm)
              # npm reports a "total" key, pnpm does not: sum the severity buckets and ignore "total".
              n=$(jq '(.metadata.vulnerabilities // {}) | del(.total) | [.[]] | add // 0' "$out")
              names=$(jq -r '(.advisories // {}) | to_entries[]? | "\(.value.module_name) \(.value.severity)"' "$out" 2>/dev/null | sort -u | head -50)
              if [ -z "$names" ]; then names=$(jq -r '(.vulnerabilities // {}) | to_entries[]? | "\(.key) \(.value.severity)"' "$out" 2>/dev/null | head -50); fi
              ;;
          esac
          echo "SOSS8_FINDINGS audit kind=${KIND} dir=${DIR} vulns=${n}"
          {
            echo "### ${KIND} audit (${DIR}): ${n} vulnerabilit(ies)"
            if [ -n "${names:-}" ]; then echo '```'; echo "$names"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" != "0" ]; then
            if [ "$BLOCKING" = "true" ]; then
              echo "::error title=dependency audit (${KIND} ${DIR})::${n} known vulnerabilit(ies); see job summary. Blocking."
              exit 1
            fi
            echo "::warning title=dependency audit (${KIND} ${DIR})::${n} known vulnerabilit(ies); see job summary. Warn-first, not blocking."
          fi

  static-analysis:
    name: static analysis (bandit)
    if: ${{ inputs.bandit_paths != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Bandit (warn-first unless block_static)
        continue-on-error: ${{ !inputs.block_static }}
        env:
          BLOCKING: ${{ inputs.block_static }}
          PATHS: ${{ inputs.bandit_paths }}
          EXCLUDE: ${{ inputs.bandit_exclude }}
          SEVERITY: ${{ inputs.bandit_severity }}
          BANDIT_VERSION: ${{ inputs.bandit_version }}
        run: |
          # bandit exits 1 on findings; the report, not the exit code, is what counts.
          set +e
          set -u
          out="$RUNNER_TEMP/bandit.json"
          case "$SEVERITY" in low) sev="-l" ;; high) sev="-lll" ;; *) sev="-ll" ;; esac
          cfg=()
          if [ -f pyproject.toml ] && grep -q '^\[tool\.bandit' pyproject.toml; then cfg=(-c pyproject.toml); fi
          # shellcheck disable=SC2086
          uvx --from "bandit[toml]==${BANDIT_VERSION}" bandit -r $PATHS -x "$EXCLUDE" "${cfg[@]}" $sev -f json -o "$out" -q
          if [ ! -s "$out" ] || ! jq -e . "$out" >/dev/null 2>&1; then
            echo "SOSS8_FINDINGS bandit=unknown"
            echo "::warning title=bandit::static analysis could not run or produced no report"
            if [ "$BLOCKING" = "true" ]; then exit 1; fi
            exit 0
          fi
          n=$(jq '.results | length' "$out")
          echo "SOSS8_FINDINGS bandit=${n}"
          {
            echo "### bandit: ${n} finding(s) at ${SEVERITY} or above"
            if [ "$n" != "0" ]; then
              echo "| Test | Severity | File | Line |"
              echo "|---|---|---|---|"
              jq -r '.results[] | "| \(.test_id) | \(.issue_severity) | \(.filename) | \(.line_number) |"' "$out" | sort -u | head -50
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" != "0" ]; then
            if [ "$BLOCKING" = "true" ]; then
              echo "::error title=bandit::${n} static-analysis finding(s); see job summary. Blocking."
              exit 1
            fi
            echo "::warning title=bandit::${n} static-analysis finding(s); see job summary. Warn-first, not blocking."
          fi
